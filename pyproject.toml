[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futsal-analysis"
version = "0.1.0"
description = "Local, evidence-aware futsal broadcast analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "opencv-python>=4.8,<5", "pandas>=2.2,<3",
  "pyarrow>=18", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "ultralytics>=8.3.0", "lap>=0.5.12", "av>=12.0.0",
  "plotly>=5.18.0", "streamlit>=1.35.0", "scipy>=1.13",
  "scikit-learn>=1.5", "imageio-ffmpeg>=0.5.0", "gdown>=5.0.0",
  "scenedetect>=0.6.0", "psutil>=5.9.0"
]
[project.optional-dependencies]
phase1 = ["supervision>=0.25.0,<=0.30.0", "requests>=2.32,<3"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]
rfdetr = ["rfdetr"]
reid = ["onnxruntime"]
embeddings = ["transformers>=4.45", "umap-learn>=0.5.5", "sentencepiece>=0.2", "protobuf>=4.25"]
colab = ["supervision>=0.25.0,<=0.30.0", "matplotlib>=3.8", "ipywidgets>=8"]
[project.scripts]
futsal-phase1 = "futsal.phase1.cli:main"
futsal-phase2 = "futsal.phase2.cli:main"
futsal-phase3 = "futsal.phase3.cli:main"
futsal-phase4 = "futsal.phase4.cli:main"
futsal-phase5 = "futsal.phase5.cli:main"
futsal = "futsal.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"futsal.vendor" = ["*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110

